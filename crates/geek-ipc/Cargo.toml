[package]
name = "geek-ipc"
version = "0.1.0"
description = "The versioned protocol between GeekVPN and its privileged helper, and its local transport"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
geek-config = { path = "../geek-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
