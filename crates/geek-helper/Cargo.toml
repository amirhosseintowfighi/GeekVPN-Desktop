[package]
name = "geek-helper"
version = "0.1.0"
description = "geekvpn-helper: GeekVPN's privileged service for TUN mode and the kill switch"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "geekvpn-helper"
path = "src/main.rs"

[dependencies]
geek-config = { path = "../geek-config" }
geek-ipc = { path = "../geek-ipc" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "signal", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_System_Rpc",
] }
