[package]
name = "geek-core"
version = "0.1.0"
description = "Runs and talks to geekcore, GeekVPN's connection engine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
geek-config = { path = "../geek-config" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time"] }
