[package]
name = "geekvpn-desktop"
version = "0.1.0"
description = "GeekVPN desktop client"
authors = ["GeekVPN"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The staticlib/cdylib pair is what Tauri's mobile targets expect; desktop only
# links the rlib, so keeping the default name costs nothing.
name = "geekvpn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
