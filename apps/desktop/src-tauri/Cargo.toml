[package]
name = "geekvpn-desktop"
version = "0.1.0"
description = "GeekVPN desktop client"
authors = ["GeekVPN"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The staticlib/cdylib pair is what Tauri's mobile targets expect; desktop only
# links the rlib, so keeping the default name costs nothing.
name = "geekvpn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-os = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
geek-api = { path = "../../../crates/geek-api" }
geek-config = { path = "../../../crates/geek-config" }
geek-core = { path = "../../../crates/geek-core" }
geek-ipc = { path = "../../../crates/geek-ipc" }
geek-netplat = { path = "../../../crates/geek-netplat" }
geek-secrets = { path = "../../../crates/geek-secrets" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
netdev = "0.46"
sysinfo = "0.38"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time", "signal"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
